<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Entry</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h2 class="text-center text-primary">Milk Entry Form</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="cow_id" class="form-label">Select Milking Cow</label>
                    <select class="form-select" name="cow_id" id="cow_id" required>
                        <option value="">-- Select Cow --</option>
                        {% for cow in milking_cows %}
                            <option value="{{ cow.id }}">{{ cow.name }} (ID: {{ cow.id }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="milk_amount" class="form-label">Milk Produced (Liters)</label>
                    <input type="number" step="0.1" min="0" class="form-control" name="milk_amount" id="milk_amount" required>
                </div>
                <div class="mb-3">
                    <label for="date_recorded" class="form-label">Date</label>
                    <input type="date" class="form-control" name="date_recorded" id="date_recorded" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Submit Record</button>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            let today = new Date().toISOString().split('T')[0];
            $('#date_recorded').attr('max', today);
        });
    </script>
</body>
</html>
