{% extends 'base.html' %}

{% block content %}
<div class="chat-container">
    <h4 class="text-center">Chatbot</h4>
    <div id="chat-box" class="mb-3" style="height: 300px; overflow-y: auto;"></div>
    <div class="input-group">
        <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function sendMessage() {
        let userInput = document.getElementById("user-input").value;
        if (!userInput.trim()) return;
    
        let chatBox = document.getElementById("chat-box");
    
        // Append User Message
        let userMessage = `<div class="message user-message">${userInput}</div>`;
        chatBox.innerHTML += userMessage;
    
        // Send request to backend
        fetch("/chatbot/get_response/", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `message=${encodeURIComponent(userInput)}`
        })
        .then(response => response.json())
        .then(data => {
            let botMessage = `<div class="message bot-message">${data.response || "Error: No response received."}</div>`;
            chatBox.innerHTML += botMessage;
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(error => {
            console.error("Error:", error);
            let botMessage = `<div class="message bot-message">Error connecting to chatbot.</div>`;
            chatBox.innerHTML += botMessage;
        });
    
        // Clear input field
        document.getElementById("user-input").value = "";
    }
</script>
{% endblock %}
