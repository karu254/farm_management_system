{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h2>Delete Milk Record</h2>
    <p>Are you sure you want to delete the record for <b>{{ record.cow.name }}</b> on <b>{{ record.date }}</b>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'milk_record_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
