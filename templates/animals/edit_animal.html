{% extends 'base.html' %}
{% block content %}
<h2>Edit Animal</h2>
<form method="POST" class="form-control shadow p-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="{% url 'animal_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
