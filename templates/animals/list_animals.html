{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>All Animals</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age (Months)</th>
                <th>Gender</th>
                <th>Category</th>
                <th>Date Added</th>
            </tr>
        </thead>
        <tbody>
            {% for animal in animals %}
            <tr>
                <td>{{ animal.name }}</td>
                <td>{{ animal.age_in_months }}</td>
                <td>{{ animal.gender }}</td>
                <td>{{ animal.category }}</td>
                <td>{{ animal.date_added }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
