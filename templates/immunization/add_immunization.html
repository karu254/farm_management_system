{% extends 'base.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Immunization</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center">Add Immunization</h2>
        
        <div class="card shadow-lg p-4">
            <h3 class="text-center mb-4">Immunization Type</h3>
            <form method="POST">
                {% csrf_token %}
                {{ immunization_form.as_p }}
                <button type="submit" class="btn btn-success">Add Immunization Type</button>
            </form>
        </div>

        <hr class="my-4">

        <div class="card shadow-lg p-4">
            <h3 class="text-center mb-4">Immunization Record</h3>
            <form method="POST">
                {% csrf_token %}
                {{ immunization_record_form.as_p }}
                <button type="submit" class="btn btn-primary">Add Immunization Record</button>
            </form>
        </div>
    </div>
</body>
</html>
{% endblock %}
