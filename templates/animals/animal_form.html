{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center">🐮 Add Animal Details</h2>
    <div class="card shadow p-4 rounded">
        <form method="POST" class="needs-validation">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Animal Tag Number</label>
                    {{ form.tag_number }}
                </div>
                <div class="col-md-6">
                    <label class="form-label">Breed</label>
                    {{ form.breed }}
                </div>
            </div>
            
            <div class="row mt-3">
                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    {{ form.gender }}
                </div>
                <div class="col-md-6">
                    <label class="form-label">Weight (kg)</label>
                    {{ form.weight }}
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    {{ form.date_of_birth }}
                </div>
                <div class="col-md-6">
                    <label class="form-label">Age (if bought)</label>
                    {{ form.age }}
                </div>
            </div>

            <div class="form-check mt-3">
                {{ form.is_bought }}
                <label class="form-check-label">Was this animal bought?</label>
            </div>

            <button type="submit" class="btn btn-success mt-3 w-100">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
